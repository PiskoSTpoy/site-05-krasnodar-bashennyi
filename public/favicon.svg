<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Башенный кран">
  <!-- Дизайн-код сайта: кремовая бумага, терракотовый акцент, только прямые
       линии и ни одного скругления. Силуэт — башенный кран: мачта, стрела,
       противовесная консоль и грузовой трос. -->
  <rect width="64" height="64" fill="#FAF7F0"/>
  <rect x="1.5" y="1.5" width="61" height="61" fill="none" stroke="#241F1A" stroke-width="3"/>
  <!-- мачта -->
  <rect x="28" y="18" width="7" height="36" fill="#241F1A"/>
  <!-- основание -->
  <rect x="20" y="50" width="23" height="4" fill="#241F1A"/>
  <!-- стрела и противовесная консоль -->
  <rect x="10" y="14" width="44" height="5" fill="#A6432A"/>
  <!-- противовес -->
  <rect x="10" y="19" width="7" height="6" fill="#241F1A"/>
  <!-- грузовой трос с крюком -->
  <rect x="44" y="19" width="3" height="17" fill="#241F1A"/>
  <rect x="41" y="36" width="9" height="4" fill="#241F1A"/>
</svg>
